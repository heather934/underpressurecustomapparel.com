}

function setPurchaseStatus(key, value, selectEl) {
  const statuses = JSON.parse(localStorage.getItem('purchaseStatuses') || '{}');
  statuses[key] = value;
  localStorage.setItem('purchaseStatuses', JSON.stringify(statuses));
  // Update select color class
  if (selectEl) {
    selectEl.className = 'item-status-select ' + (value==='have'?'have':value==='part'?'part':'need');
  }
  // Update card border color
  const card = selectEl?.closest('.purchase-item-card');
  if (card) {
    card.style.borderLeftColor = value==='have'?'#4ade80':value==='part'?'var(--accent)':'var(--hs-red)';
  }
  // Update status badge
  const badge = card?.querySelector('.status-badge');
  if (badge) {
    badge.className = 'status-badge ' + (value==='have'?'have':value==='part'?'part':'need');
    badge.textContent = value==='have'?'✅ In Stock':value==='part'?'⚠ Partially In Stock':'🔴 Need to Order';
  }
  showToast('Status updated');
}

function togglePurchaseCard(id) {
  const card = document.getElementById(id);
  if (card) card.classList.toggle('collapsed');
}

function exportPurchaseCSV() {
  loadProductionOrders();
  const realOrders = productionOrders.filter(o => !o._storeRegistration && !o.completed);
  const breakdown = {};
  realOrders.forEach(order => {
    if (!breakdown[order.store]) breakdown[order.store] = {};
    const sd = breakdown[order.store];
    (order.items || []).forEach(item => {
      const name = item.name || 'Unknown';
      const size = item.size || 'No Size';
      const color = item.color || 'No Color';
      const qty = parseInt(item.qty) || 1;
      if (!sd[name]) sd[name] = { _colors: {} };
      const key = size + '|' + color;
      sd[name][key] = (sd[name][key] || 0) + qty;
    });
  });

  const rows = [['Store', 'Item', 'Size', 'Color', 'Quantity', 'Stock Status']];
  Object.entries(breakdown).forEach(([store, items]) => {
    Object.entries(items).forEach(([item, data]) => {
      Object.entries(data).filter(([k]) => k !== '_colors').forEach(([key, qty]) => {
        const [size, color] = key.split('|');
        const statusKey2 = store + '::' + item;
      const allStatuses2 = JSON.parse(localStorage.getItem('purchaseStatuses') || '{}');
      const itemStatus = allStatuses2[statusKey2] || 'need';
      const statusLabel = itemStatus==='have'?'In Stock':itemStatus==='part'?'Partially In Stock':'Need to Order';
      rows.push([store, item, size, color, qty, statusLabel]);
      });
    });
  });

  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `UP-Purchase-List-${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`;
  a.click();
}

// ══════════════════════════════════════════════════════
//  COST ANALYSIS
// ══════════════════════════════════════════════════════
var itemCosts = {};        // { itemName: costPrice }
var costPeriod = 'all';    // '30' | '90' | 'all' | 'custom'
var costView = 'store';    // 'store' | 'order' | 'product'
var costDateFrom = '';
var costDateTo = '';

function loadItemCosts() {
  try { itemCosts = JSON.parse(localStorage.getItem('itemCosts') || '{}'); }
  catch(e) { itemCosts = {}; }
}
function saveItemCosts() {
  // Read all cost inputs from the modal
  document.querySelectorAll('.cost-input').forEach(inp => {
    const name = inp.dataset.item;
    const val = parseFloat(inp.value);

  });

  closeCostModal();
  renderAdminPanel('costanalysis');

}
function openCostModal() {
  loadProductionOrders();
  loadItemCosts();
  // Collect unique item names from all orders
  const items = [...new Set(
    productionOrders
      .filter(o => !o._storeRegistration)
      .flatMap(o => (o.items||[]).map(i => i.name))
      .filter(Boolean)
  )].sort();

  if (!items.length) {
    showToast('No orders yet — costs can be set once orders come in');

  }

    <table class="cost-entry-table">

        ${items.map(name => {

              ${name}
            </td>

              <input class="cost-input" data-item="${name.replace(/"/g,'&quot;')}"
                type="number" step="0.01" min="0"
                value="${itemCosts[name] !== undefined ? itemCosts[name].toFixed(2) : ''}"
                placeholder="0.00">
            </td>
            <td style="text-align:right;font-family:'Bebas Neue',sans-serif;font-size:16px;color:#4ade80;">
              ${salePrice > 0 ? '$'+salePrice.toFixed(2) : '—'}
            </td>
          </tr>`;
        }).join('')}
      </tbody>

  document.getElementById('costEntryModal').classList.add('open');
  a11yOpenTrap(document.getElementById('costEntryModal'));
}
function closeCostModal() {
  document.getElementById('costEntryModal').classList.remove('open');
  a11yCloseTrap();
}
document.getElementById('costEntryModal')?.addEventListener('click', function(e) {
  if (e.target === this) closeCostModal();
});

function getSalePrice(itemName) {
  // Look up sale price from orders
  for (const o of productionOrders) {
    const item = (o.items||[]).find(i => i.name === itemName);
    if (item && item.salePrice) return parseFloat(item.salePrice);
  }
  return 0;
}

function filterOrdersByPeriod(orders) {
  const now = new Date();
  return orders.filter(o => {
    if (o._storeRegistration) return false;
    const d = new Date(o.timestamp);
    if (costPeriod === '30') return (now - d) <= 30*24*60*60*1000;
    if (costPeriod === '90') return (now - d) <= 90*24*60*60*1000;
    if (costPeriod === 'custom' && costDateFrom && costDateTo) {
      return d >= new Date(costDateFrom) && d <= new Date(costDateTo + 'T23:59:59');
    }
    return true; // 'all'
  });
}

function calcOrderFinancials(orders) {
  var totalRevenue = 0, totalCost = 0, totalItems = 0;
  orders.forEach(o => {
    (o.items||[]).forEach(item => {
      const qty = parseInt(item.qty) || 1;
      const sale = parseFloat(item.salePrice) || 0;
      const cost = itemCosts[item.name] !== undefined ? parseFloat(itemCosts[item.name]) : null;
      totalRevenue += sale * qty;
      if (cost !== null) totalCost += cost * qty;
      totalItems += qty;
    });
  });
  const profit = totalRevenue - totalCost;
  const margin = totalRevenue > 0 ? (profit / totalRevenue * 100) : 0;
  return { totalRevenue, totalCost, profit, margin, totalItems };
}

function renderCostAnalysis() {
  loadProductionOrders();
  loadItemCosts();
  const filtered = filterOrdersByPeriod(productionOrders.filter(o => !o._storeRegistration));
  const { totalRevenue, totalCost, profit, margin, totalItems } = calcOrderFinancials(filtered);
  const hasCosts = Object.keys(itemCosts).length > 0;
  const marginClass = margin >= 40 ? 'high' : margin >= 20 ? 'mid' : 'low';
  const marginColor = margin >= 40 ? '#4ade80' : margin >= 20 ? 'var(--accent)' : 'var(--hs-red)';

  // Period buttons

    {k:'30', l:'Last 30 Days'},
    {k:'90', l:'Last 90 Days'},
    {k:'all', l:'All Time'},
    {k:'custom', l:'Custom Range'}

  const periodBtns = periods.map(p =>
    `<button class="cost-period-btn${costPeriod===p.k?' on':''}" onclick="costPeriod='${p.k}';renderAdminPanel('costanalysis')">${p.l}</button>`
  ).join('');

  const customRange = costPeriod === 'custom' ? `
    <div class="cost-date-range">
      <input type="date" class="cost-date-input" value="${costDateFrom}"
        onchange="costDateFrom=this.value;renderAdminPanel('costanalysis')">
      <span style="color:var(--up-mist);font-family:'Barlow Condensed',sans-serif;">to</span>
      <input type="date" class="cost-date-input" value="${costDateTo}"
        onchange="costDateTo=this.value;renderAdminPanel('costanalysis')">
    </div>` : '';

  // View tabs
  const views = [{k:'store',l:'By Store'},{k:'order',l:'By Order'},{k:'product',l:'By Product'}];
  const viewTabs = views.map(v =>
    `<button class="cost-view-tab${costView===v.k?' active':''}" onclick="costView='${v.k}';renderAdminPanel('costanalysis')">${v.l}</button>`
  ).join('');

  // Build the selected view
  var viewContent = '';
  if (costView === 'store')   viewContent = buildStoreView(filtered);
  if (costView === 'order')   viewContent = buildOrderView(filtered);
  if (costView === 'product') viewContent = buildProductView(filtered);

  return `
    <div class="cm-section-head">
      <div>
        <div class="cm-section-title" style="color:#4ade80;">Cost <span style="color:var(--up-sky)">Analysis</span></div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;color:var(--up-mist);text-transform:uppercase;margin-top:4px;">
          Revenue · Production cost · Profit margin
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-set-costs" onclick="openCostModal()">💰 Set Item Costs</button>
        <button class="btn-prod-export" onclick="exportCostCSV()">⬇ Export CSV</button>
      </div>
    </div>

    ${!hasCosts ? `<div style="background:rgba(232,180,0,.1);border:1px solid rgba(232,180,0,.3);padding:12px 16px;margin-bottom:16px;font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--accent);letter-spacing:.5px;">
      ⚠ No production costs set yet — click <strong>Set Item Costs</strong> to enter what you pay per item and unlock full profit analysis.
    </div>` : ''}

    <div class="cost-period-bar">
      ${periodBtns}
      ${customRange}
    </div>

    <div class="cost-summary-grid">
      <div class="cost-card revenue">
        <div class="cost-card-label">Total Revenue</div>
        <div class="cost-card-value">$${totalRevenue.toFixed(2)}</div>
        <div class="cost-card-sub">${totalItems} items · ${filtered.length} order${filtered.length!==1?'s':''}</div>
      </div>
      <div class="cost-card cost">
        <div class="cost-card-label">Production Cost</div>
        <div class="cost-card-value">${hasCosts ? '$'+totalCost.toFixed(2) : '—'}</div>
        <div class="cost-card-sub">${hasCosts ? 'Based on your cost entries' : 'Set item costs to calculate'}</div>
      </div>
      <div class="cost-card profit">
        <div class="cost-card-label">Gross Profit</div>
        <div class="cost-card-value" style="color:${profit>=0?'var(--up-sky)':'var(--hs-red)'}">${hasCosts ? (profit>=0?'+':'')+'$'+profit.toFixed(2) : '—'}</div>
        <div class="cost-card-sub">${hasCosts ? 'Revenue minus production cost' : '—'}</div>
      </div>
      <div class="cost-card margin">
        <div class="cost-card-label">Profit Margin</div>
        <div class="cost-card-value" style="color:${marginColor}">${hasCosts ? margin.toFixed(1)+'%' : '—'}</div>
        <div class="cost-card-sub">
          ${hasCosts ? `<div class="margin-bar-wrap"><div class="margin-bar ${marginClass}" style="width:${Math.min(margin,100)}%"></div></div>` : 'Set item costs to calculate'}
        </div>
      </div>
    </div>

    <div class="cost-view-tabs">${viewTabs}</div>

    ${viewContent}

    <div class="cm-tip" style="margin-top:14px;">
      💡 Revenue is based on item sale prices from orders. Set your production costs via "Set Item Costs" to see accurate profit margins. Export to CSV for your accountant.
    </div>`;

// ── BY STORE VIEW ──
function buildStoreView(orders) {
  const stores = [...new Set(orders.map(o => o.store))];
  if (!stores.length) return `<div class="prod-empty">No orders in this period.</div>`;

  const storeData = {};
  orders.forEach(o => {
    if (!storeData[o.store]) storeData[o.store] = { revenue:0, cost:0, items:0, orders:0 };
    const d = storeData[o.store];
    d.orders++;
    (o.items||[]).forEach(item => {
      const qty = parseInt(item.qty)||1;
      d.items += qty;
      d.revenue += (parseFloat(item.salePrice)||0) * qty;
      const c = itemCosts[item.name];
      if (c !== undefined) d.cost += parseFloat(c) * qty;
    });
  });

  const rows = Object.entries(storeData).map(([store, d]) => {
    const profit = d.revenue - d.cost;
    const margin = d.revenue > 0 ? profit/d.revenue*100 : 0;
    const sc = store==='River City Rampage'?'#1a6b2f':store==='Rome CoC Youth T-Shirts'?'#7c3aed':store==='Huntington Steel'?'#c8102e':'var(--up-blue)';
    const hasCost = d.cost > 0;
    return `<tr class="cost-row">
      <td class="cost-td"><span class="prod-store-badge" style="background:${sc};color:#fff;">${store}</span></td>
      <td class="cost-td"><div class="cost-revenue-val">$${d.revenue.toFixed(2)}</div></td>
      <td class="cost-td"><div class="cost-cost-val">${hasCost?'$'+d.cost.toFixed(2):'—'}</div></td>
      <td class="cost-td"><div class="cost-profit-val ${profit>=0?'pos':'neg'}">${hasCost?(profit>=0?'+':'')+'$'+profit.toFixed(2):'—'}</div></td>
      <td class="cost-td" style="min-width:120px;">
        ${hasCost?`<div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:${margin>=40?'#4ade80':margin>=20?'var(--accent)':'var(--hs-red)'}">${margin.toFixed(1)}%</div>
        <div class="margin-bar-wrap"><div class="margin-bar ${margin>=40?'high':margin>=20?'mid':'low'}" style="width:${Math.min(margin,100)}%"></div></div>`:'—'}
      </td>
      <td class="cost-td" style="text-align:right;color:var(--up-mist);font-size:12px;">${d.orders} orders · ${d.items} items</td>
    </tr>`;
  }).join('');

  return `<div class="cm-table-wrap"><table class="cost-table">
    <thead class="cost-thead"><tr>
      <th>Store</th><th>Revenue</th><th>Production Cost</th><th>Profit</th><th>Margin</th><th style="text-align:right;">Volume</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// ── BY ORDER VIEW ──
function buildOrderView(orders) {
  if (!orders.length) return `<div class="prod-empty">No orders in this period.</div>`;
  const sorted = [...orders].sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp));

  const rows = sorted.map(o => {
    let rev = 0, cost = 0, items = 0;
    (o.items||[]).forEach(item => {
      const qty = parseInt(item.qty)||1;
      items += qty;
      rev += (parseFloat(item.salePrice)||0)*qty;
      const c = itemCosts[item.name];
      if (c!==undefined) cost += parseFloat(c)*qty;
    });
    const profit = rev - cost;
    const margin = rev > 0 ? profit/rev*100 : 0;
    const hasCost = cost > 0;
    const sc = o.store==='River City Rampage'?'#1a6b2f':o.store==='Rome CoC Youth T-Shirts'?'#7c3aed':o.store==='Huntington Steel'?'#c8102e':'var(--up-blue)';
    return `<tr class="cost-row">
      <td class="cost-td">
        <div class="cost-name">${o.customer}</div>
        <div class="cost-sub">${new Date(o.timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
      </td>
      <td class="cost-td"><span class="prod-store-badge" style="background:${sc};color:#fff;font-size:9px;">${o.store}</span></td>
      <td class="cost-td"><div class="cost-revenue-val">$${rev.toFixed(2)}</div></td>
      <td class="cost-td"><div class="cost-cost-val">${hasCost?'$'+cost.toFixed(2):'—'}</div></td>
      <td class="cost-td"><div class="cost-profit-val ${profit>=0?'pos':'neg'}">${hasCost?(profit>=0?'+':'')+'$'+profit.toFixed(2):'—'}</div></td>
      <td class="cost-td">${hasCost?`<span style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:${margin>=40?'#4ade80':margin>=20?'var(--accent)':'var(--hs-red)'}">${margin.toFixed(1)}%</span>`:'—'}</td>
      <td class="cost-td" style="color:var(--up-mist);font-size:12px;text-align:right;">${items} item${items!==1?'s':''}</td>
    </tr>`;
  }).join('');

  return `<div class="cm-table-wrap"><table class="cost-table">
    <thead class="cost-thead"><tr>
      <th>Customer</th><th>Store</th><th>Revenue</th><th>Cost</th><th>Profit</th><th>Margin</th><th style="text-align:right;">Items</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// ── BY PRODUCT VIEW ──
function buildProductView(orders) {
  if (!orders.length) return `<div class="prod-empty">No orders in this period.</div>`;
  const products = {};
  orders.forEach(o => {
    (o.items||[]).forEach(item => {
      const name = item.name||'Unknown';
      if (!products[name]) products[name] = { revenue:0, cost:0, qty:0 };
      const qty = parseInt(item.qty)||1;
      products[name].qty += qty;
      products[name].revenue += (parseFloat(item.salePrice)||0)*qty;
      const c = itemCosts[name];
      if (c!==undefined) products[name].cost += parseFloat(c)*qty;
    });
  });

  const sorted = Object.entries(products).sort((a,b) => b[1].revenue - a[1].revenue);

  const rows = sorted.map(([name, d]) => {
    const profit = d.revenue - d.cost;
    const margin = d.revenue > 0 ? profit/d.revenue*100 : 0;
    const hasCost = d.cost > 0;
    const unitCost = itemCosts[name] !== undefined ? '$'+parseFloat(itemCosts[name]).toFixed(2) : '—';
    const unitSale = d.qty > 0 && d.revenue > 0 ? '$'+(d.revenue/d.qty).toFixed(2) : '—';
    return `<tr class="cost-row">
      <td class="cost-td"><div class="cost-name">${name}</div>
        <div class="cost-sub">Unit cost: ${unitCost} · Avg sale: ${unitSale}</div>
      </td>
      <td class="cost-td" style="text-align:center;font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--up-sky);">${d.qty}</td>
      <td class="cost-td"><div class="cost-revenue-val">$${d.revenue.toFixed(2)}</div></td>
      <td class="cost-td"><div class="cost-cost-val">${hasCost?'$'+d.cost.toFixed(2):'—'}</div></td>
      <td class="cost-td"><div class="cost-profit-val ${profit>=0?'pos':'neg'}">${hasCost?(profit>=0?'+':'')+'$'+profit.toFixed(2):'—'}</div></td>
      <td class="cost-td" style="min-width:130px;">
        ${hasCost?`<div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:${margin>=40?'#4ade80':margin>=20?'var(--accent)':'var(--hs-red)'}">${margin.toFixed(1)}%</div>
        <div class="margin-bar-wrap"><div class="margin-bar ${margin>=40?'high':margin>=20?'mid':'low'}" style="width:${Math.min(margin,100)}%"></div></div>`:'—'}
      </td>
    </tr>`;
  }).join('');

  return `<div class="cm-table-wrap"><table class="cost-table">
    <thead class="cost-thead"><tr>
      <th>Product</th><th style="text-align:center;">Units Sold</th><th>Revenue</th><th>Total Cost</th><th>Profit</th><th>Margin</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// ── EXPORT CSV ──
function exportCostCSV() {
  loadProductionOrders();
  loadItemCosts();
  const filtered = filterOrdersByPeriod(productionOrders.filter(o => !o._storeRegistration));
  const rows = [['Store','Customer','Date','Item','Qty','Sale Price','Production Cost','Profit','Margin %']];
  filtered.forEach(o => {
    (o.items||[]).forEach(item => {
      const qty = parseInt(item.qty)||1;
      const sale = parseFloat(item.salePrice)||0;
      const cost = itemCosts[item.name] !== undefined ? parseFloat(itemCosts[item.name]) : '';
      const profit = cost !== '' ? (sale - cost) * qty : '';
      const margin = cost !== '' && sale > 0 ? ((sale-cost)/sale*100).toFixed(1)+'%' : '';
      rows.push([o.store, o.customer, new Date(o.timestamp).toLocaleDateString(),
        item.name||'', qty, sale>0?'$'+sale.toFixed(2):'',
        cost!==''?'$'+(cost*qty).toFixed(2):'',
        profit!==''?(profit>=0?'+':'')+'$'+profit.toFixed(2):'', margin]);
    });
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`UP-Cost-Analysis-${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`;
  a.click();
}

function timeAgo(date) {
  const diff = Date.now() - date.getTime();
  const mins = Math.floor(diff/60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return hrs+'h ago';
  const days = Math.floor(hrs/24);
  return days+'d ago';
}

var customerSearch = '';

function renderCustomers() {
  loadProductionOrders();
  const real = productionOrders.filter(o => !o._storeRegistration);

  // Build customer map
  const customers = {};
  real.forEach(o => {
    const key = (o.email || o.phone || o.customer || '').toLowerCase();
    if (!key) return;
    if (!customers[key]) customers[key] = { name:o.customer, email:o.email||'', phone:o.phone||'', orders:[], totalSpend:0, stores:new Set() };
    customers[key].orders.push(o);
    customers[key].stores.add(o.store);
    customers[key].totalSpend += (o.items||[]).reduce((s,i)=>s+(parseFloat(i.salePrice)||0)*(parseInt(i.qty)||1),0);
  });

  const sorted = Object.values(customers)
    .filter(c => !customerSearch || [c.name,c.email,c.phone].join(' ').toLowerCase().includes(customerSearch.toLowerCase()))
    .sort((a,b) => b.orders.length - a.orders.length);

  const cardsHTML = sorted.length ? sorted.map((c,idx) => {
    const initials = c.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
    const lastOrder = c.orders.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];
    const storeColors = ['#1565ff','#1a6b2f','#7c3aed','#c8102e'];
    const orderRows = c.orders.slice(0,5).map(o => {
      const rev = (o.items||[]).reduce((s,i)=>s+(parseFloat(i.salePrice)||0)*(parseInt(i.qty)||1),0);
      return `<div class="customer-order-row">
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--up-mist);width:90px;">${new Date(o.timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>
        <span style="flex:1;font-size:12px;color:var(--up-silver);">${o.store}</span>
        <span style="font-size:12px;color:var(--up-mist);">${(o.items||[]).reduce((s,i)=>s+(parseInt(i.qty)||1),0)} items</span>
        ${rev>0?`<span style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:#4ade80;margin-left:10px;">$${rev.toFixed(2)}</span>`:''}
        <button class="btn-reorder" style="margin-left:8px;" onclick="reorderFromCustomer(${idx},event)">↺ Reorder</button>
      </div>`;
    }).join('');

    return `<div class="customer-card" id="ccard-${idx}" onclick="toggleCustomerCard(${idx})">
      <div class="customer-card-head">
        <div class="customer-avatar" style="background:${storeColors[idx%4]}">${initials}</div>
        <div style="flex:1;">
          <div class="customer-name">${c.name}</div>
          <div class="customer-contact">${[c.email,c.phone].filter(Boolean).join(' · ')}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:#4ade80;">$${c.totalSpend.toFixed(2)}</div>
          <div style="font-size:10px;color:var(--up-mist);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;">TOTAL SPENT</div>
        </div>
      </div>
      <div class="customer-stats">
        <div class="customer-stat"><strong>${c.orders.length}</strong> order${c.orders.length!==1?'s':''}</div>
        <div class="customer-stat"><strong>${[...c.stores].length}</strong> store${[...c.stores].length!==1?'s':''}</div>
        <div class="customer-stat">Last: <strong>${timeAgo(new Date(lastOrder.timestamp))}</strong></div>
        <div class="customer-stat">▼ Click to expand</div>
      </div>
      <div class="customer-orders-list" id="corders-${idx}">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;color:var(--up-mist);text-transform:uppercase;margin-bottom:6px;">Order History</div>
        ${orderRows}
        <div id="reorder-confirm-${idx}" class="reorder-confirm"></div>

  return `
    <div class="cm-section-head">
      <div><div class="cm-section-title" style="color:#4ade80;">Customer <span style="color:var(--up-sky)">Database</span></div>

      <button class="btn-prod-export" onclick="exportCustomerCSV()">⬇ Export CSV</button>
    </div>

      <input class="customer-search" placeholder="🔍 Search by name, email, or phone..." value="${customerSearch}"

function toggleCustomerCard(idx) {
  const card = document.getElementById('ccard-'+idx);
  const orders = document.getElementById('corders-'+idx);
  if (card && orders) {
    card.classList.toggle('expanded');
    orders.style.display = card.classList.contains('expanded') ? 'block' : 'none';
  }
}

function reorderFromCustomer(idx, e) {
  e.stopPropagation();
  const real = productionOrders.filter(o=>!o._storeRegistration);
  const customers = {};
  real.forEach(o=>{
    const key=(o.email||o.phone||o.customer||'').toLowerCase();
    if(!key)return;
    if(!customers[key])customers[key]={name:o.customer,orders:[]};
    customers[key].orders.push(o);
  });
  const customer = Object.values(customers).sort((a,b)=>b.orders.length-a.orders.length)[idx];
  if (!customer) return;
  const lastOrder = customer.orders.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];
  const confirmEl = document.getElementById('reorder-confirm-'+idx);
  if (!confirmEl) return;
  confirmEl.innerHTML = `
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--up-sky);margin-bottom:8px;letter-spacing:1px;">
      ↺ Duplicate last order (${new Date(lastOrder.timestamp).toLocaleDateString()}) into a new production entry?
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn-reorder" style="background:var(--up-blue);color:#fff;border-color:var(--up-blue);" onclick="confirmReorder(${idx})">✓ Yes, Reorder</button>
      <button class="btn-cancel-a" onclick="this.closest('.reorder-confirm').classList.remove('show');this.closest('.reorder-confirm').innerHTML=''">Cancel</button>
    </div>`;
  confirmEl.classList.add('show');
}

function confirmReorder(idx) {
  const real = productionOrders.filter(o=>!o._storeRegistration);
  const customers = {};
  real.forEach(o=>{
    const key=(o.email||o.phone||o.customer||'').toLowerCase();
    if(!key)return;
    if(!customers[key])customers[key]={name:o.customer,orders:[]};
    customers[key].orders.push(o);
  });
  const customer = Object.values(customers).sort((a,b)=>b.orders.length-a.orders.length)[idx];
  if (!customer) return;
  const lastOrder = customer.orders.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0];
  const newOrder = {
    ...lastOrder,
    id: Date.now(),
    timestamp: new Date().toISOString(),
    completed: false,
    _reorder: true,
  };
  productionOrders.unshift(newOrder);
  saveProductionOrders();
  renderAdminPanel('production');
  showToast(`Reorder created for ${customer.name}!`);
}

function exportCustomerCSV() {
  loadProductionOrders();
  const real = productionOrders.filter(o=>!o._storeRegistration);
  const customers = {};
  real.forEach(o=>{
    const key=(o.email||o.phone||o.customer||'').toLowerCase();
    if(!key)return;
    if(!customers[key])customers[key]={name:o.customer,email:o.email||'',phone:o.phone||'',orders:0,spend:0,stores:new Set()};
    customers[key].orders++;
    customers[key].spend+=(o.items||[]).reduce((s,i)=>s+(parseFloat(i.salePrice)||0)*(parseInt(i.qty)||1),0);
    customers[key].stores.add(o.store);
  });
  const rows=[['Name','Email','Phone','Total Orders','Total Spent','Stores']];
  Object.values(customers).forEach(c=>rows.push([c.name,c.email,c.phone,c.orders,'$'+c.spend.toFixed(2),[...c.stores].join('; ')]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`UP-Customers-${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`;a.click();
}

var deadlines = [];
var newDeadlineTitle = '';
var newDeadlineStore = '';
var newDeadlineDate = '';
var newDeadlineNotes = '';

function loadDeadlines() {
  try { deadlines = JSON.parse(localStorage.getItem('upDeadlines')||'[]'); } catch(e) { deadlines=[]; }
}
function saveDeadlines() { localStorage.setItem('upDeadlines', JSON.stringify(deadlines)); }

function addDeadline() {
  const title = document.getElementById('dl-title')?.value.trim();
  const store = document.getElementById('dl-store')?.value.trim();
  const date  = document.getElementById('dl-date')?.value;
  const notes = document.getElementById('dl-notes')?.value.trim();
  if (!title || !date) { showToast('Title and date are required'); return; }
  deadlines.push({ id:Date.now(), title, store, date, notes, completed:false });
  saveDeadlines();
  renderAdminPanel('deadlines');
  showToast(`Deadline added: ${title}`);
}
function deleteDeadline(id) {
  deadlines = deadlines.filter(d=>d.id!==id);
  saveDeadlines(); renderAdminPanel('deadlines');
}
function toggleDeadlineDone(id) {
  const d = deadlines.find(x=>x.id===id);
  if (d) { d.completed=!d.completed; saveDeadlines(); renderAdminPanel('deadlines'); }
}

function renderDeadlines() {
  loadDeadlines();
  const active = deadlines.filter(d=>!d.completed).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const done   = deadlines.filter(d=>d.completed);

  const buildCard = (d) => {
    const days = Math.ceil((new Date(d.date+'T12:00:00') - Date.now()) / 86400000);
    const cls = days < 0 ? 'overdue' : days <= 2 ? 'urgent' : days <= 7 ? 'soon' : 'ok';
    const col = days < 0 ? '#666' : days <= 2 ? 'var(--hs-red)' : days <= 7 ? 'var(--accent)' : '#4ade80';
    const label = days < 0 ? `${Math.abs(days)}d late` : days === 0 ? 'TODAY' : `${days} day${days!==1?'s':''}`;
    return `<div class="deadline-card ${cls}">
      <div class="deadline-days-box">
        <div class="deadline-days-num" style="color:${col}">${days<0?'⚠':days}</div>
        <div class="deadline-days-lbl">${days<0?'overdue':days===0?'TODAY':'days'}</div>
      </div>
      <div class="deadline-info">
        <div class="deadline-title">${d.title}${d.completed?' ✅':''}</div>
        <div class="deadline-sub">${d.store||'General'} · Due ${new Date(d.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div>
        ${d.notes?`<div style="font-size:11px;color:var(--up-mist);margin-top:3px;font-style:italic;">${d.notes}</div>`:''}
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">
        <button class="row-check" style="background:none;border:1px solid var(--up-border);color:var(--up-mist);padding:4px 10px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1px;text-transform:uppercase;transition:all .2s;"
          onclick="toggleDeadlineDone(${d.id})">${d.completed?'↩ Undo':'✓ Done'}</button>
        <button class="btn-deadline-del" onclick="deleteDeadline(${d.id})" aria-label="Delete deadline">✕</button>
      </div>
    </div>`;
  };

  return `
    <div class="cm-section-head">
      <div><div class="cm-section-title" style="color:var(--accent);">Order <span style="color:var(--up-sky)">Deadlines</span></div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;color:var(--up-mist);text-transform:uppercase;margin-top:4px;">${active.length} active · ${done.length} completed</div></div>
    </div>

    <div class="deadline-form">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:12px;">+ Add New Deadline</div>
      <div class="deadline-form-grid">
        <div class="f"><label>Order / Event *</label><input id="dl-title" class="deadline-input" placeholder="e.g. Rampage Spring Jackets" value="${newDeadlineTitle}"></div>
        <div class="f"><label>Team / Store</label>
          <select id="dl-store" class="deadline-input">
            <option value="">General</option>
            <option>River City Rampage</option>
            <option>Rome CoC Youth T-Shirts</option>
            <option>Huntington Steel</option>
            <option>UP Sportswear</option>
          </select>
        </div>
        <div class="f"><label>Needed By *</label><input id="dl-date" type="date" class="deadline-input" value="${newDeadlineDate}"></div>
        <button class="btn-deadline-add" onclick="addDeadline()">+ Add</button>
      </div>
      <div class="f" style="margin-top:8px;"><label>Notes (optional)</label><input id="dl-notes" class="deadline-input" placeholder="Any special instructions..." value="${newDeadlineNotes}"></div>
    </div>

    <div class="deadline-list">
      ${active.length ? active.map(buildCard).join('') : `<div class="dash-empty">No active deadlines — add one above</div>`}
    </div>

    ${done.length ? `
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;color:var(--up-mist);text-transform:uppercase;margin:16px 0 8px;">Completed</div>
      <div class="deadline-list">${done.map(buildCard).join('')}</div>
    ` : ''}`;
}

  catch(e) { discountCodes = []; }
}
function saveDiscountCodes() {
  localStorage.setItem('upDiscountCodes', JSON.stringify(discountCodes));
  kvSet('discountCodes', discountCodes);
}

function applyDiscount() {
  const input = document.getElementById('discountCodeInput');
  const btn = document.getElementById('discountApplyBtn');
  const code = (input?.value || '').trim().toUpperCase();

  if (!code) {
    showDiscountError('Please enter a discount code');
    return;
  }

  const originalLabel = btn ? btn.textContent : 'Apply';
  if (btn) { btn.disabled = true; btn.textContent = 'Checking...'; }

  setTimeout(() => {
    loadDiscountCodes();
    const errEl = document.getElementById('discountErrorMsg');
    const appliedWrap = document.getElementById('discountAppliedWrap');
    const inputWrap = document.getElementById('discountInputWrap');
    const appliedMsg = document.getElementById('discountAppliedMsg');

    const match = discountCodes.find(d =>
      d.code.toUpperCase() === code &&
      d.active &&
      (!d.maxUses || d.uses < d.maxUses) &&
      (!d.expiry || new Date(d.expiry) > new Date())
    );

    if (btn) { btn.disabled = false; btn.textContent = originalLabel; }

    if (!match) {
      showDiscountError('Invalid or expired code — please check and try again');
      return;
    }

    // Apply it
    appliedDiscount = match;
    const label = match.type === 'percent'
      ? `${match.value}% off`
      : `$${parseFloat(match.value).toFixed(2)} off`;

    if (appliedWrap)  { appliedWrap.style.display = 'block'; }
    if (inputWrap)    { inputWrap.style.display = 'none'; }
    if (appliedMsg)   { appliedMsg.textContent = `Code "${match.code}" applied — ${label}${match.minOrder ? ' (min order $'+match.minOrder+')' : ''}`; }
    if (errEl)        { errEl.style.display = 'none'; }

    // Recalculate totals in checkout
    recalcCheckoutTotal();
    showToast(`Discount applied: ${label} 🎉`);
  }, 350);
}

function showDiscountError(msg) {
  const errEl = document.getElementById('discountErrorMsg');
  if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
  setTimeout(() => { if(errEl) errEl.style.display='none'; }, 3000);
}

function removeDiscount() {
  appliedDiscount = null;
  const appliedWrap = document.getElementById('discountAppliedWrap');
  const inputWrap = document.getElementById('discountInputWrap');
  const input = document.getElementById('discountCodeInput');
  if (appliedWrap) appliedWrap.style.display = 'none';
  if (inputWrap) inputWrap.style.display = 'flex';
  if (input) input.value = '';
  recalcCheckoutTotal();
  showToast('Discount code removed');
}

function getDiscountAmount(subtotal) {
  if (!appliedDiscount) return 0;
  const minOrder = parseFloat(appliedDiscount.minOrder || 0);
  if (subtotal < minOrder) {
    showDiscountError(`Minimum order of $${minOrder.toFixed(2)} required for this code`);
    return 0;
  }
  if (appliedDiscount.type === 'percent') {
    return subtotal * (parseFloat(appliedDiscount.value) / 100);
  }
  return Math.min(parseFloat(appliedDiscount.value), subtotal);
}

function recalcCheckoutTotal() {
  // Update the total rows in the checkout summary from the single pricing source
  const t = calcOrderTotals();
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  set('checkoutSubtotal', `$${t.sub.toFixed(2)}`);
  set('checkoutDiscountRow', `-$${t.disc.toFixed(2)}`);
  const discWrap = document.getElementById('checkoutDiscountRowWrap');
  if (discWrap) discWrap.style.display = t.disc > 0 ? 'flex' : 'none';
  set('checkoutShipping', `$${t.ship.toFixed(2)}`);
  set('checkoutTax', `$${t.tax.toFixed(2)}`);
  set('checkoutGrandTotal', `$${t.grand.toFixed(2)}`);
}

function incrementDiscountUse(code) {
  loadDiscountCodes();
  const d = discountCodes.find(x => x.code.toUpperCase() === code.toUpperCase());
  if (d) { d.uses = (d.uses || 0) + 1; saveDiscountCodes(); }
}

function addDiscountCode() {
  const code     = document.getElementById('dcCode')?.value.trim().toUpperCase();
  const type     = document.getElementById('dcType')?.value;
  const value    = document.getElementById('dcValue')?.value.trim();
  const minOrder = document.getElementById('dcMinOrder')?.value.trim();
  const maxUses  = document.getElementById('dcMaxUses')?.value.trim();
  const expiry   = document.getElementById('dcExpiry')?.value;
  const desc     = document.getElementById('dcDesc')?.value.trim();
  const stores   = document.getElementById('dcStore')?.value;

  if (!code)  { showToast('Code name is required'); return; }
  if (!value || isNaN(value) || parseFloat(value) <= 0) { showToast('Enter a valid discount value'); return; }
  if (type === 'percent' && parseFloat(value) > 100) { showToast('Percentage cannot exceed 100%'); return; }

  loadDiscountCodes();
  if (discountCodes.find(d => d.code.toUpperCase() === code)) {
    showToast('That code already exists — please use a different name'); return;
  }

  discountCodes.push({
    code, type, value: parseFloat(value),
    minOrder: minOrder ? parseFloat(minOrder) : 0,
    maxUses: maxUses ? parseInt(maxUses) : null,
    expiry: expiry || null,
    description: desc, stores,
    active: true, uses: 0,
    createdAt: new Date().toISOString()
  });
  saveDiscountCodes();
  renderAdminPanel('discounts');
  showToast(`Discount code "${code}" created! 🏷️`);
}

function toggleDiscountActive(idx) {
  loadDiscountCodes();
  discountCodes[idx].active = !discountCodes[idx].active;
  saveDiscountCodes();
  renderAdminPanel('discounts');
  showToast(discountCodes[idx].active ? 'Code activated' : 'Code deactivated');
}



function exportDiscountCSV() {

function globalSearch(query) {
  const section = document.getElementById('searchBarSection');
  const resultsWrap = document.getElementById('searchResultsWrap');
  const countEl = document.getElementById('searchResultCount');
  if (!resultsWrap) return;

  if (!query || query.trim().length < 2) {
    resultsWrap.style.display = 'none';
    if (countEl) countEl.style.display = 'none';
    return;
  }

  const q = query.toLowerCase().trim();
  const index = buildSearchIndex();
  const matches = index.filter(item =>
    item.name.toLowerCase().includes(q) ||
    item.store.toLowerCase().includes(q) ||
    item.category.toLowerCase().includes(q)
  );
  const shown = matches.slice(0, 10);

  if (!matches.length) {
    resultsWrap.style.display = 'block';
    resultsWrap.innerHTML = `<div class="search-no-results">No products found for "<strong>${query}</strong>" — try a different search term.</div>`;
    if (countEl) countEl.style.display = 'none';
    return;
  }

  if (countEl) {
    countEl.style.display = 'block';
    countEl.textContent = matches.length === 1
      ? `1 result for "${query}"`
      : matches.length > shown.length
        ? `Showing ${shown.length} of ${matches.length} results for "${query}"`
        : `${matches.length} results for "${query}"`;
  }

  resultsWrap.style.display = 'block';
  resultsWrap.innerHTML = shown.map(item => `
    <div class="search-result-item" onclick="(${item.action.toString()})(); clearSearch();">
      <div class="search-result-img" style="background:${item.storeColor}22;">
        ${item.img ? `<img src="${item.img}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">` : '👕'}
      </div>
      <div style="flex:1;">
        <div class="search-result-name">${highlightMatch(item.name, q)}</div>
        <div class="search-result-store">
          <span style="background:${item.storeColor};color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:1px 7px;">${item.store}</span>
          ${item.category ? `<span style="font-size:11px;color:var(--up-mist);margin-left:8px;">${item.category}</span>` : ''}
        </div>
      </div>
      <div class="search-result-price">${item.price}</div>
    </div>`).join('');
}

function highlightMatch(text, query) {
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0,idx) +
    '<mark style="background:rgba(77,159,255,.3);color:var(--up-white);">' +
    text.slice(idx, idx+query.length) + '</mark>' +
    text.slice(idx+query.length);
}

function filterDropdown(key, query) {
  const wrap = document.getElementById(key + 'DropdownItems');
  const noResults = document.getElementById(key + 'DropdownNoResults');
  const countEl = document.getElementById(key + 'DropdownResultCount');
  if (!wrap) return;

  const q = query.trim().toLowerCase();
  const items = Array.from(wrap.querySelectorAll('.dropdown-item'));

  if (!q) {
    // Reset to default state
    items.forEach(item => {
      item.style.display = '';
      const nameEl = item.querySelector('.dropdown-item-name');
      if (nameEl && nameEl.dataset.original) nameEl.innerHTML = nameEl.dataset.original;
    });
    wrap.querySelectorAll('.dropdown-section-label').forEach(l => { l.style.display = ''; });
    if (noResults) noResults.style.display = 'none';
    if (countEl) countEl.style.display = 'none';
    return;
  }

  var visibleCount = 0;
  items.forEach(item => {
    const nameEl = item.querySelector('.dropdown-item-name');
    if (nameEl && !nameEl.dataset.original) nameEl.dataset.original = nameEl.textContent;
    const original = nameEl ? nameEl.dataset.original : '';
    const haystack = ((item.dataset.search || '') + ' ' + original).toLowerCase();
    const match = haystack.includes(q);
    item.style.display = match ? '' : 'none';
    if (match) visibleCount++;
    if (nameEl) nameEl.innerHTML = original.toLowerCase().includes(q) ? highlightMatch(original, q) : original;
  });

  // Hide section labels that have no visible items following them
  const children = Array.from(wrap.children);
  var currentLabel = null, labelHasVisible = false;
  children.forEach(child => {
    if (child.classList.contains('dropdown-section-label')) {
      if (currentLabel) currentLabel.style.display = labelHasVisible ? '' : 'none';
      currentLabel = child;
      labelHasVisible = false;
    } else if (child.classList.contains('dropdown-item') && child.style.display !== 'none') {
      labelHasVisible = true;
    }
  });
  if (currentLabel) currentLabel.style.display = labelHasVisible ? '' : 'none';

  if (noResults) noResults.style.display = visibleCount ? 'none' : 'block';
  if (countEl) {
    if (visibleCount) {
      countEl.style.display = 'block';
      countEl.textContent = visibleCount === 1 ? '1 store found' : `${visibleCount} stores found`;
    } else {
      countEl.style.display = 'none';
    }
  }
}

function clearSearch() {
  const input = document.getElementById('globalSearchInput');
  const results = document.getElementById('searchResultsWrap');
  const countEl = document.getElementById('searchResultCount');
  if (input) input.value = '';
  if (results) results.style.display = 'none';
  if (countEl) countEl.style.display = 'none';
}

function toggleSearch() {
  const section = document.getElementById('searchBarSection');
  if (!section) return;
  const isVisible = section.style.display !== 'none';
  section.style.display = isVisible ? 'none' : 'block';
  const btn = document.querySelector('[onclick*="toggleSearch"]');
  if (btn) btn.setAttribute('aria-expanded', String(!isVisible));
  if (!isVisible) {
    setTimeout(() => document.getElementById('globalSearchInput')?.focus(), 100);
  }
}

// Close search on outside click
document.addEventListener('click', function(e) {
  if (!e.target.closest('#searchBarSection') && !e.target.closest('[onclick*="toggleSearch"]')) {
    const results = document.getElementById('searchResultsWrap');
    if (results) results.style.display = 'none';
  }
});

function getInvoiceNumber(orderId) {
  // Generate readable invoice number from order ID
  const d = new Date(orderId);
  const yr = d.getFullYear().toString().slice(-2);
  const mo = String(d.getMonth()+1).padStart(2,'0');
  const seq = String(orderId).slice(-4);
  return `UP-${yr}${mo}-${seq}`;
}

  loadProductionOrders();

          ${o.completed ? '<span style="color:#4ade80;margin-left:8px;">✅ Completed</span>' : '<span style="color:var(--up-mist);margin-left:8px;">⏳ Pending</span>'}
        </div>
      </div>
      ${total > 0 ? `<div class="invoice-amount">$${total.toFixed(2)}</div>` : '<div class="invoice-amount" style="color:var(--up-mist);">—</div>'}
      <button class="btn-view-invoice" onclick="generateInvoice(${o.id})">🧾 Generate</button>
    </div>`;
  }).join('') : `<div class="dash-empty">No orders yet — invoices will appear here automatically as orders come in.</div>`;

  return `

    <div class="cm-tip">📄 Invoices open in a new window ready to print or save as PDF. Share with team coaches for reimbursement.</div>`;
}

      item.style.display = '';
      const labelEl = item.querySelector('.admin-nav-item-label');
      if (labelEl && labelEl.dataset.original) labelEl.innerHTML = labelEl.dataset.original;
    });
    if (noResults) noResults.style.display = 'none';
    if (countEl) countEl.style.display = 'none';
    return;
  }

  var visibleCount = 0;
  items.forEach(item => {
    const labelEl = item.querySelector('.admin-nav-item-label');
    if (labelEl && !labelEl.dataset.original) labelEl.dataset.original = labelEl.textContent;
    const original = labelEl ? labelEl.dataset.original : item.textContent;
    const match = original.toLowerCase().includes(q);
    item.style.display = match ? '' : 'none';
    if (match) visibleCount++;
    if (labelEl) labelEl.innerHTML = match ? highlightMatch(original, q) : original;
  });

  if (noResults) noResults.style.display = visibleCount ? 'none' : 'block';
  if (countEl) {
    if (visibleCount) {
      countEl.style.display = 'block';
      countEl.textContent = visibleCount === 1 ? '1 section found' : `${visibleCount} sections found`;
    } else {
      countEl.style.display = 'none';
    }
  }
}

var _confirmCallback = null;

  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmIcon').textContent = icon;
  const okBtn = document.getElementById('confirmOkBtn');
  okBtn.textContent = label;
  _confirmCallback = onConfirm;
  okBtn.onclick = () => { closeConfirmModal(); if (_confirmCallback) _confirmCallback(); };
  document.getElementById('confirmModal').classList.add('open');
  a11yOpenTrap(document.getElementById('confirmModal'));
}

function closeConfirmModal() {
  document.getElementById('confirmModal').classList.remove('open');
  a11yCloseTrap();
  _confirmCallback = null;
}
document.getElementById('confirmModal')?.addEventListener('click', function(e) {
  if (e.target === this) closeConfirmModal();
});

//  INLINE FIELD VALIDATION
//  Shows a specific error message right under a field
//  instead of a generic toast/alert. Works for any
//  field that has a matching "{id}-error" element
//  next to it — see checkout, quote, HS order, and
//  design forms.

function showFieldError(id, msg) {
  const el = document.getElementById(id);
  const err = document.getElementById(id + '-error');
  if (el) el.classList.add('has-error');
  if (err) { err.textContent = msg; err.classList.add('show'); }
}
function clearFieldError(id) {
  const el = document.getElementById(id);
  const err = document.getElementById(id + '-error');
  if (el) el.classList.remove('has-error');
  if (err) { err.textContent = ''; err.classList.remove('show'); }
}
function clearFieldErrors(ids) { ids.forEach(clearFieldError); }

// ═══════════════════════════════════════════════════
//  ACCESSIBILITY: Escape-to-close + focus trapping
//  Covers every modal dialog on the page, plus the
//  global search bar. (Admin panel gets Escape-to-close
//  only, since it's an inline section, not a dialog.)
// ═══════════════════════════════════════════════════
const A11Y_MODALS = [
  { id: 'cartDrawer',     close: () => closeCart() },
  { id: 'checkoutModal',  close: () => closeCheckout() },
  { id: 'quoteModal',     close: () => closeQuoteModal() },
  { id: 'hsMsgModal',     close: () => closeHsModal() },
  { id: 'editModal',      close: () => closeEditModal() },
  { id: 'costEntryModal', close: () => closeCostModal() },
  { id: 'reviewModal',    close: () => closeReviewModal() },
  { id: 'cmModal',        close: () => closeCMModal() },
  { id: 'adminPanel',     close: () => closeAdmin() }
];

var a11yLastFocused = null;
var a11yTrapEl = null;

function a11yGetFocusable(container) {
  if (!container) return [];
  return Array.from(container.querySelectorAll(
    'a[href], button:not([disabled]), textarea, input:not([disabled]), select, [tabindex]:not([tabindex="-1"])'
  )).filter(el => el.offsetParent !== null);
}

function a11yOpenTrap(container) {
  if (!container) return;
  a11yLastFocused = document.activeElement;
  a11yTrapEl = container;
  const focusables = a11yGetFocusable(container);
  (focusables[0] || container).focus({ preventScroll: true });
}

function a11yCloseTrap() {
  a11yTrapEl = null;
  if (a11yLastFocused && typeof a11yLastFocused.focus === 'function') {
    a11yLastFocused.focus({ preventScroll: true });
  }
  a11yLastFocused = null;
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    // Gallery lightbox takes priority since it's created dynamically
    if (document.getElementById('galleryLightbox')) { document.getElementById('galleryLightbox').remove(); return; }
    for (const m of A11Y_MODALS) {
      const el = document.getElementById(m.id);
      if (el && el.classList.contains('open')) { m.close(); return; }
    }
    const searchSection = document.getElementById('searchBarSection');
    if (searchSection && searchSection.style.display !== 'none') { toggleSearch(); return; }
    if (document.activeElement) document.activeElement.blur();
  }
  if (e.key === 'Tab' && a11yTrapEl) {
    const focusables = a11yGetFocusable(a11yTrapEl);
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// ═══════════════════════════════════════════════════
//  Trigger admin check on page load
// ═══════════════════════════════════════════════════
async function loadFromKV() {
  // Load products from KV, fall back to localStorage
  const kvProducts = await kvGet('products');
  if (kvProducts && Array.isArray(kvProducts) && kvProducts.length > 0) {
    upProducts = kvProducts;
    localStorage.setItem('upSportswear', JSON.stringify(upProducts));
  } else {
    loadUP();
  }

  // Load teams from KV
  const kvTeams = await kvGet('teams');
  if (kvTeams && Array.isArray(kvTeams) && kvTeams.length > 0) {
    teams = kvTeams;
    localStorage.setItem('upTeams', JSON.stringify(teams));
  }

  // Load hidden stores from KV
  const kvHidden = await kvGet('hiddenStores');
  if (kvHidden && Array.isArray(kvHidden)) {
    hiddenStores = new Set(kvHidden);
    localStorage.setItem('hiddenStores', JSON.stringify(kvHidden));
  }

  // Load discount codes from KV
  const kvDiscounts = await kvGet('discountCodes');
  if (kvDiscounts && Array.isArray(kvDiscounts)) {
    discountCodes = kvDiscounts;
    localStorage.setItem('upDiscountCodes', JSON.stringify(discountCodes));
  }

  // Load store access from KV
  const kvAccess = await kvGet('storeAccess');
  if (kvAccess) {
    storeAccess = kvAccess;
    localStorage.setItem('storeAccess', JSON.stringify(storeAccess));
  }

  const kvCodes = await kvGet('storeCodes');
  if (kvCodes) {
    storeCodes = kvCodes;
    localStorage.setItem('storeCodes', JSON.stringify(storeCodes));
  }
}

document.addEventListener('DOMContentLoaded', async function() {
  // Cloudflare Access handles authentication — open admin directly
  document.getElementById('adminOverlay').style.display = 'flex';
  await loadFromKV();
  renderUP();
  renderAdminPanel('dashboard');
});
// Also run immediately in case DOMContentLoaded already fired
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  document.getElementById('adminOverlay').style.display = 'flex';
  loadFromKV().then(() => { renderUP(); renderAdminPanel('dashboard'); });
}
