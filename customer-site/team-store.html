<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Store — Under Pressure Custom Apparel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root {
  --up-black:  #060810;
  --up-navy:   #0d1220;
  --up-card:   #111827;
  --up-border: #1a2535;
  --up-mist:   #5a7296;
  --up-silver: #8ba3c7;
  --up-white:  #eef2fb;
  --up-blue:   #1565ff;
  --up-sky:    #4d9fff;
  --hs-red:    #c8102e;
  --accent:    #e91e8c;
  --team-color: #1565ff;
  --team-color2: #1565ff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--up-black);
  color: var(--up-white);
  font-family: 'Barlow', sans-serif;
  min-height: 100vh;
}

/* ── HEADER ── */
.ts-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6,8,16,.96);
  border-bottom: 1px solid var(--up-border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.ts-header-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.ts-back-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--up-mist);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color .2s;
  flex-shrink: 0;
}
.ts-back-btn:hover { color: var(--up-white); }
.ts-header-brand {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--up-mist);
  text-transform: uppercase;
  text-align: center;
  flex: 1;
}
.ts-cart-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  background: rgba(21,101,255,.12);
  border: 1px solid rgba(21,101,255,.3);
  color: var(--up-sky);
  padding: 8px 16px;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.ts-cart-btn:hover { background: rgba(21,101,255,.22); border-color: var(--up-blue); color: var(--up-white); }
.ts-cart-count {
  background: var(--accent);
  color: #fff;
  border-radius: 50%;
  width: 18px;
  height: 18px;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
}

/* ── HERO ── */
.ts-hero {
  background: linear-gradient(160deg, var(--team-color) 0%, var(--up-black) 60%);
  padding: 56px 24px 48px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.ts-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.06) 0%, transparent 70%);
  pointer-events: none;
}
.ts-hero-logo {
  width: 80px;
  height: 80px;
  object-fit: contain;
  margin-bottom: 16px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.15);
}
.ts-hero-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 48px;
  font-weight: 900;
  letter-spacing: 4px;
  text-transform: uppercase;
  line-height: 1;
  margin-bottom: 8px;
}
.ts-hero-desc {
  font-size: 15px;
  color: rgba(255,255,255,.7);
  font-weight: 300;
  max-width: 480px;
  margin: 0 auto;
}

/* ── CATEGORY TABS ── */
.ts-tabs-wrap {
  background: var(--up-navy);
  border-bottom: 1px solid var(--up-border);
  position: sticky;
  top: 64px;
  z-index: 90;
}
.ts-tabs {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.ts-tabs::-webkit-scrollbar { display: none; }
.ts-tab {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--up-mist);
  padding: 14px 20px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .2s;
  white-space: nowrap;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}
.ts-tab:hover { color: var(--up-white); }
.ts-tab.active { color: var(--up-white); border-bottom-color: var(--team-color); }

/* ── PRODUCT GRID ── */
.ts-grid-wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}
.ts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
}
.ts-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 24px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--up-mist);
  text-transform: uppercase;
}

/* ── PRODUCT CARD ── */
.ts-card {
  background: var(--up-card);
  border: 1px solid var(--up-border);
  display: flex;
  flex-direction: column;
  transition: border-color .2s, transform .2s;
  cursor: pointer;
}
.ts-card:hover { border-color: rgba(77,159,255,.4); transform: translateY(-2px); }
.ts-card-previewer {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  background: #f0f0f0;
  isolation: isolate;
  overflow: hidden;
}
.ts-card-mockup {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.ts-card-tint {
  position: absolute;
  inset: 0;
  mix-blend-mode: multiply;
  pointer-events: none;
  mask-size: contain;
  mask-repeat: no-repeat;
  mask-position: center;
  -webkit-mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
}
.ts-card-design {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.ts-card-design img {
  width: 100%;
  height: auto;
  object-fit: contain;
}
.ts-card-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--up-mist);
}
.ts-card-placeholder-icon { font-size: 48px; opacity: .4; }
.ts-card-placeholder-text {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.ts-card-view-toggle {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  background: rgba(0,0,0,.4);
  border-radius: 30px;
  padding: 2px;
  gap: 2px;
  z-index: 10;
}
.ts-card-view-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  background: transparent;
  color: rgba(255,255,255,.6);
  transition: all .15s;
}
.ts-card-view-btn.active {
  background: var(--accent);
  color: #fff;
}
.ts-card-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}
.ts-card-labels {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.ts-card-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--up-white);
  line-height: 1.2;
}
.ts-card-design-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--up-sky);
  text-transform: uppercase;
}
.ts-card-price {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--up-white);
  flex-shrink: 0;
}

/* ── COLOR SWATCHES ON CARD ── */
.ts-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.ts-swatch {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all .15s;
  flex-shrink: 0;
}
.ts-swatch.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--up-card), 0 0 0 4px var(--accent);
}
.ts-color-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--up-mist);
  text-transform: uppercase;
  margin-top: 2px;
}

/* ── ADD TO CART BUTTON ── */
.ts-add-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: var(--team-color);
  color: #fff;
  border: none;
  padding: 11px 16px;
  cursor: pointer;
  width: 100%;
  transition: opacity .2s;
  margin-top: auto;
}
.ts-add-btn:hover { opacity: .85; }
.ts-add-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ── SIZE + QTY SELECTORS ── */
.ts-size-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.ts-size-chip {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 4px 10px;
  border: 1px solid var(--up-border);
  color: var(--up-mist);
  cursor: pointer;
  background: var(--up-navy);
  transition: all .15s;
  user-select: none;
}
.ts-size-chip:hover { border-color: var(--up-sky); color: var(--up-sky); }
.ts-size-chip.selected {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(233,30,140,.08);
}
.ts-qty-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.ts-qty-btn {
  width: 28px;
  height: 28px;
  background: var(--up-navy);
  border: 1px solid var(--up-border);
  color: var(--up-silver);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  flex-shrink: 0;
}
.ts-qty-btn:hover { border-color: var(--up-sky); color: var(--up-white); }
.ts-qty-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--up-white);
  min-width: 24px;
  text-align: center;
}

/* ── CART DRAWER ── */
.ts-cart-drawer {
  position: fixed;
  top: 0;
  right: -420px;
  width: 420px;
  height: 100vh;
  background: var(--up-card);
  border-left: 1px solid var(--up-border);
  z-index: 500;
  display: flex;
  flex-direction: column;
  transition: right .3s ease;
  overflow: hidden;
}
.ts-cart-drawer.open { right: 0; }
.ts-cart-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 499;
  display: none;
}
.ts-cart-backdrop.open { display: block; }
.ts-cart-head {
  padding: 20px 24px;
  border-bottom: 1px solid var(--up-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.ts-cart-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.ts-cart-close {
  background: none;
  border: 1px solid var(--up-border);
  color: var(--up-mist);
  width: 32px;
  height: 32px;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
}
.ts-cart-close:hover { border-color: var(--hs-red); color: var(--hs-red); }
.ts-cart-items { flex: 1; overflow-y: auto; padding: 16px; }
.ts-cart-item {
  display: flex;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--up-border);
  align-items: flex-start;
}
.ts-cart-item-swatch {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,.15);
}
.ts-cart-item-info { flex: 1; min-width: 0; }
.ts-cart-item-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--up-white);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ts-cart-item-meta {
  font-size: 11px;
  color: var(--up-mist);
  margin-top: 2px;
}
.ts-cart-item-price {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--up-white);
  flex-shrink: 0;
}
.ts-cart-item-del {
  background: none;
  border: none;
  color: var(--up-mist);
  cursor: pointer;
  font-size: 14px;
  padding: 0 2px;
  transition: color .2s;
  flex-shrink: 0;
}
.ts-cart-item-del:hover { color: var(--hs-red); }
.ts-cart-empty {
  text-align: center;
  padding: 60px 24px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--up-mist);
  text-transform: uppercase;
}
.ts-cart-foot {
  padding: 16px 24px;
  border-top: 1px solid var(--up-border);
  flex-shrink: 0;
}
.ts-cart-totals { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.ts-cart-total-row {
  display: flex;
  justify-content: space-between;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  letter-spacing: 1.5px;
  color: var(--up-mist);
  text-transform: uppercase;
}
.ts-cart-total-row.grand {
  font-size: 16px;
  font-weight: 700;
  color: var(--up-white);
  border-top: 1px solid var(--up-border);
  padding-top: 8px;
  margin-top: 4px;
}
.ts-checkout-btn {
  width: 100%;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 14px;
  cursor: pointer;
  transition: opacity .2s;
}
.ts-checkout-btn:hover { opacity: .88; }
.ts-checkout-btn:disabled { opacity: .4; cursor: not-allowed; }
.ts-cart-note {
  font-size: 11px;
  color: var(--up-mist);
  text-align: center;
  margin-top: 10px;
}

/* ── CHECKOUT MODAL ── */
.ts-modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 600;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.ts-modal-bg.open { display: flex; }
.ts-modal-box {
  background: var(--up-card);
  border: 1px solid var(--up-border);
  border-top: 3px solid var(--accent);
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
}
.ts-modal-head {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--up-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ts-modal-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.ts-modal-close {
  background: none;
  border: 1px solid var(--up-border);
  color: var(--up-mist);
  width: 32px;
  height: 32px;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ts-modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.ts-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.ts-form-f { display: flex; flex-direction: column; gap: 5px; }
.ts-form-f.full { grid-column: 1 / -1; }
.ts-form-f label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--up-mist);
  text-transform: uppercase;
}
.ts-form-f input, .ts-form-f textarea {
  background: var(--up-navy);
  border: 1px solid var(--up-border);
  color: var(--up-white);
  padding: 9px 12px;
  font-family: 'Barlow', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color .2s;
  width: 100%;
}
.ts-form-f input:focus, .ts-form-f textarea:focus { border-color: var(--up-sky); }
.ts-form-f textarea { min-height: 72px; resize: vertical; }
.ts-section-lbl {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--up-sky);
  text-transform: uppercase;
  border-bottom: 1px solid var(--up-border);
  padding-bottom: 6px;
}
.ts-order-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  padding: 4px 0;
}
.ts-order-row.total {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 700;
  border-top: 1px solid var(--up-border);
  padding-top: 8px;
  margin-top: 4px;
}
.ts-submit-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 14px;
  cursor: pointer;
  width: 100%;
  transition: opacity .2s;
  margin-top: 8px;
}
.ts-submit-btn:hover { opacity: .88; }

/* ── GALLERY ── */
.ts-gallery-wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px 80px;
}
.ts-gallery-head {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--up-mist);
  text-transform: uppercase;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--up-border);
}
.ts-gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
}
.ts-gallery-item {
  aspect-ratio: 1;
  overflow: hidden;
  cursor: pointer;
  position: relative;
}
.ts-gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .3s;
}
.ts-gallery-item:hover img { transform: scale(1.04); }
.ts-gallery-caption {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,.6);
  color: #fff;
  font-size: 11px;
  padding: 6px 10px;
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 1px;
  opacity: 0;
  transition: opacity .2s;
}
.ts-gallery-item:hover .ts-gallery-caption { opacity: 1; }

/* ── TOAST ── */
.ts-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--up-navy);
  border: 1px solid var(--up-border);
  color: var(--up-white);
  padding: 12px 24px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  z-index: 999;
  transition: transform .3s ease;
  pointer-events: none;
  white-space: nowrap;
}
.ts-toast.show { transform: translateX(-50%) translateY(0); }

/* ── LOADING ── */
.ts-loading {
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.ts-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid rgba(255,255,255,.1);
  border-top-color: var(--up-blue);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bump { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }

<script>

// ── Product catalog — maps admin type → mockup files + graphic placement ──

                views: [{ key:'front', label:'Front', src:'/womens-shorts-front.b64' }],
                graphicView:'front', graphicTop:'38%', graphicLeft:'42%', graphicWidth:'24%' },
  jersey:     { label: 'Jersey',                category: 'tops',    icon: '🏃', views: [], placeholder: true },
  jacket:     { label: 'Batting Jacket',        category: 'tops',    icon: '🧤', views: [], placeholder: true },

// Backward-compat: a product's design(s) live either in the current
// designs{front,back,side} shape or, for older team stores not yet re-saved
// in the admin, as flat designId/designName/designUrl/placement fields.
// Read through this rather than migrating stored data.
function getProductDesigns(product) {
  if (product.designs) return product.designs;
  if (product.designId || product.designUrl) {
    return {
      [product.placement || 'front']: {
        designId: product.designId, designName: product.designName, designUrl: product.designUrl,
        graphicLeft: product.graphicLeft, graphicTop: product.graphicTop, graphicWidth: product.graphicWidth,
      }
    };
  }
  return {};
}

const CATEGORY_LABELS = {
  all:     'All',
  tops:    'T-Shirts & Tops',
  fleece:  'Hoodies & Fleece',
  tanks:   'Tanks',
  bottoms: 'Bottoms',
  extras:  'Extras',
};

const COLOR_HEX_MAP = {
  'White':'#f0f2f5',  'Off White':'#e8e4d8', 'Natural':'#e8dcc8',
  'Black':'#1a1a1a',  'Charcoal':'#374151',  'Dark Heather':'#4a4a4a',
  'Navy':'#0f1f4b',   'Royal Blue':'#2563eb', 'Blue':'#1565ff',
  'Light Blue':'#93c5fd', 'Columbia Blue':'#9dc3d4',
  'Red':'#c8102e',    'Cardinal':'#9f1239',   'Maroon':'#881337',
  'Heather Red':'#b91c1c',
  'Sport Grey':'#8e9197', 'Grey':'#8e9197',  'Silver':'#c0c8d4',
  'Green':'#16a34a',  'Forest':'#166534',    'Kelly Green':'#22a856',
  'Gold':'#d97706',   'Yellow':'#fbbf24',
  'Purple':'#7c3aed', 'Lilac':'#a78bfa',
  'Pink':'#f472b6',   'Hot Pink':'#ec4899',  'Coral':'#fb7185',
  'Orange':'#ea580c', 'Brown':'#78350f',
  'Heather Navy':'#1e3a5f',
};
function getColorHex(name) { return COLOR_HEX_MAP[name] || '#888'; }

// Shipping methods
const SHIPPING_METHODS = [
  { id: 'pickup',    label: 'Local Orders Only (Porch Pickup)',    price: 0 },
  { id: 'local',     label: 'Huntington Area (Meet Locally)',       price: 5 },
  { id: 'usps',      label: 'USPS Shipping',                        price: null }, // calculated below
];
// USPS Priority Mail estimates from ZIP 45669 (1-7 lbs)
const USPS_RATES = { 1:9.35, 2:9.35, 3:12.50, 4:12.50, 5:16.75, 6:16.75, 7:16.75 };
function getUspsRate(qty) {
  const lbs = Math.min(Math.max(Math.ceil(qty * 0.75), 1), 7);
  return USPS_RATES[lbs] || 16.75;
}
function getShipping(qty) {
  if (!qty) return 0;
  const method = document.getElementById('co-ship-method')?.value || 'usps';
  if (method === 'pickup') return 0;
  if (method === 'local')  return 5;
  return getUspsRate(qty);
}

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let teamData   = null;
let teamId     = '';
let cart       = [];       // [{ type, label, designName, designUrl, color, size, qty, price, unitPrice }]
let activeCategory = 'all';

// Per-card UI state: cardStates[cardId] = { color, view, qty, size }
const cardStates = {};

// Resolved mockup URLs — .b64 files are fetched once and converted to
// data URLs so both <img src> and CSS mask-image work correctly.
const mockupCache = {};

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
// Preload mockup images for all product types used by this store.
// .b64 files are detected as either real PNG binaries renamed to .b64
// or actual base64 text strings — handled correctly either way.
async function preloadMockups(team) {
  const srcsToLoad = new Set();
  (team?.products || []).forEach(p => {
    const meta = PRODUCT_CATALOG[p.type];
    if (meta?.views) meta.views.forEach(v => { if (v.src) srcsToLoad.add(v.src); });
  });

  await Promise.all([...srcsToLoad].map(async src => {
    if (mockupCache[src] !== undefined) return;
    if (!src.endsWith('.b64')) {
      mockupCache[src] = src; // regular .png — use URL directly
      return;
    }
    try {
      const res    = await fetch(src);
      const buffer = await res.arrayBuffer();
      const bytes  = new Uint8Array(buffer);
      let base64;
      // PNG magic bytes: 0x89 0x50 0x4E 0x47
      if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) {
        // Real PNG binary just renamed to .b64 — encode it ourselves
        let binary = '';
        const chunk = 8192;
        for (let i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
        }
        base64 = btoa(binary);
      } else {
        // Actual base64 text file
        base64 = new TextDecoder().decode(buffer).trim();
      }
      mockupCache[src] = `data:image/png;base64,${base64}`;
    } catch(e) {
      console.warn('Mockup preload failed:', src, e);
      mockupCache[src] = src; // fall back to direct URL
    }
  }));
}

// Return the cached (data URL) version of a mockup src, or the src itself.
function getMockupSrc(src) {
  return (src && mockupCache[src] !== undefined) ? mockupCache[src] : src;
}

async function init() {
  // Read team ID from URL — supports ?team=rampage or path /rampage
  const params = new URLSearchParams(window.location.search);
  teamId = params.get('team') || window.location.pathname.replace(/^\//, '').split('/')[0] || '';

  if (!teamId) { showError('No team store specified.'); return; }

  try {
    const res  = await fetch(`${KV_API}/data/teams`);
    const data = await res.json();
    const teams = Array.isArray(data) ? data : (data.value || []);
    teamData = teams.find(t => (t.subdomain || slugify(t.name||'')) === teamId);
    if (!teamData) { showError(`Team store "${teamId}" not found.`); return; }
    await preloadMockups(teamData);
    renderStore();
  } catch(e) {
    showError('Could not load store. Please try again.');
  }
}

function slugify(str) {
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

function showError(msg) {
  document.getElementById('tsLoading').innerHTML = `
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:2px;color:var(--up-mist);text-transform:uppercase;text-align:center;padding:40px 24px;">
      ⚠ ${msg}<br><br>
      <a href="/store" style="color:var(--up-sky);text-decoration:none;font-size:11px;">← Return to UP Store</a>
    </div>`;
}

// ═══════════════════════════════════════════════════════
//  RENDER STORE
// ═══════════════════════════════════════════════════════
function renderStore() {
  const t = teamData;

  // Set CSS team color
  document.documentElement.style.setProperty('--team-color',  t.color  || '#1565ff');
  document.documentElement.style.setProperty('--team-color2', t.color2 || t.color || '#1565ff');

  // Page title
  document.title = `${t.name} — Under Pressure Custom Apparel`;

  // Hero
  const hero = document.getElementById('tsHero');
  hero.style.background = t.color2
    ? `linear-gradient(160deg, ${t.color} 0%, var(--up-black) 60%)`
    : `linear-gradient(160deg, ${t.color} 0%, var(--up-black) 60%)`;
  if (t.logo) {
    const logo = document.getElementById('tsHeroLogo');
    logo.src = t.logo;
    logo.alt = t.name;
    logo.style.display = 'block';
  }
  document.getElementById('tsHeroName').textContent = t.name;
  document.getElementById('tsHeroDesc').textContent = t.desc || '';
  hero.style.display = 'block';

  // Build product cards data — one card per enabled product
  // (design is already baked into each product)
  const enabledProducts = (t.products || []).filter(p => {
    const meta = PRODUCT_CATALOG[p.type];
    return meta; // skip unknown types
  });

  if (!enabledProducts.length) {
    document.getElementById('tsLoading').style.display = 'none';
    document.getElementById('tsGrid').style.display = 'grid';
    document.getElementById('tsGrid').innerHTML =
      '<div class="ts-empty">No products available yet — check back soon!</div>';
    document.getElementById('tsTabsWrap').style.display = 'block';
    document.getElementById('tsTabs').innerHTML =
      '<button class="ts-tab active">All</button>';
    return;
  }

  // Build category tabs from what's actually in the store
  const usedCats = new Set(enabledProducts.map(p => PRODUCT_CATALOG[p.type]?.category).filter(Boolean));
  renderTabs(usedCats);

  // Render product grid
  renderGrid(enabledProducts);

  // Gallery
  if (t.gallery && t.gallery.length) {
    const galleryGrid = document.getElementById('tsGalleryGrid');
    galleryGrid.innerHTML = t.gallery.map(g => `
      <div class="ts-gallery-item">
        <img src="${g.img}" alt="${g.caption||''}" loading="lazy" onerror="this.closest('.ts-gallery-item').style.display='none'">
        ${g.caption ? `<div class="ts-gallery-caption">${g.caption}</div>` : ''}
      </div>`).join('');
    document.getElementById('tsGalleryWrap').style.display = 'block';
  }

  // Show tabs + grid
  document.getElementById('tsTabsWrap').style.display = 'block';
  document.getElementById('tsLoading').style.display = 'none';
  document.getElementById('tsGrid').style.display = 'grid';
}

function renderTabs(usedCats) {
  const tabsEl = document.getElementById('tsTabs');
  const cats = ['all', ...Object.keys(CATEGORY_LABELS).filter(c => c !== 'all' && usedCats.has(c))];
  tabsEl.innerHTML = cats.map(c => `
    <button class="ts-tab${c === activeCategory ? ' active' : ''}"
      onclick="setCategory('${c}')">${CATEGORY_LABELS[c] || c}</button>`).join('');
}

function setCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.ts-tab').forEach(t => t.classList.toggle('active', t.textContent === (CATEGORY_LABELS[cat]||cat)));
  const products = (teamData.products || []);
  const filtered = cat === 'all' ? products : products.filter(p => PRODUCT_CATALOG[p.type]?.category === cat);
  renderGrid(filtered);
}

function renderGrid(products) {
  const grid = document.getElementById('tsGrid');
  if (!products.length) {
    grid.innerHTML = '<div class="ts-empty">No products in this category.</div>';
    return;
  }
  grid.innerHTML = products.map((p, i) => renderCard(p, i)).join('');
}

// ═══════════════════════════════════════════════════════
//  PRODUCT CARD
// ═══════════════════════════════════════════════════════
function renderCard(product, index) {
  const meta    = PRODUCT_CATALOG[product.type];
  if (!meta) return '';

  const cardId  = product.instanceId || `${product.type}-${index}`;
  const colors  = product.colors && product.colors.length ? product.colors : ['Black','Navy','White'];
  const sizes   = product.sizes  && product.sizes.length  ? product.sizes  : ['S','M','L','XL','2XL'];
  const firstColor = colors[0];
  const colorHex   = getColorHex(firstColor);

  const designs = getProductDesigns(product);
  // Default to a view that actually carries a design when one exists.
  const defaultView = meta.views.find(v => designs[v.key])?.key || meta.graphicView || meta.views[0]?.key || 'front';

  // Init card state
  if (!cardStates[cardId]) {
    cardStates[cardId] = { color: firstColor, view: defaultView, qty: 1, size: '' };
  }
  const state = cardStates[cardId];

  // Price — strip $ signs and use first value if range
  const rawPrice  = String(product.price || '25').replace(/[^0-9.–\-]/g,'').split(/[–\-]/)[0].trim();
  const unitPrice = parseFloat(rawPrice) || 25;

  // Mockup
  const hasMockup = !meta.placeholder && meta.views && meta.views.length;
  const activeView = meta.views.find(v => v.key === state.view) || meta.views[0];
  const mockupSrc  = getMockupSrc(activeView?.src || '');
  const hasViews   = meta.views.length > 1;

  // Color tint layer
  const tintStyle = hasMockup ? `background-color:${colorHex};mask-image:url('${mockupSrc}');-webkit-mask-image:url('${mockupSrc}');` : '';

  // One design overlay per placement that actually has a design — only the
  // one matching the active view is visible; toggling views swaps which.
  const overlaysHTML = hasMockup ? meta.views.map(v => {
    const d = designs[v.key];
    if (!d || !d.designUrl) return '';
    const gLeft  = d.graphicLeft  || meta.graphicLeft  || '50%';
    const gTop   = d.graphicTop   || meta.graphicTop   || '40%';
    const gWidth = d.graphicWidth || meta.graphicWidth || '35%';
    const visible = v.key === state.view;
    return `<div class="ts-card-design" id="tsdesign-${cardId}-${v.key}"
        style="position:absolute;top:${gTop};left:${gLeft};width:${gWidth};transform:translate(-50%,-50%);pointer-events:none;${visible?'':'display:none;'}">
        <img src="${d.designUrl}" alt="${d.designName||''}"
          style="width:100%;height:auto;object-fit:contain;"
          onerror="this.parentElement.style.display='none'">
      </div>`;
  }).join('') : '';

  // Label/cart use front's design when present, else whichever placement has one.
  const primaryView   = designs.front ? 'front' : Object.keys(designs)[0];
  const designName    = primaryView ? (designs[primaryView].designName || '') : '';
  const designUrl     = primaryView ? (designs[primaryView].designUrl  || '') : '';
  // The one non-front placement this type supports (back, or side for bottoms).
  const secondaryKey     = meta.views.find(v => v.key !== 'front' && designs[v.key])?.key || '';
  const secondaryDesign  = secondaryKey ? designs[secondaryKey] : null;
  const designSummary = ['front', secondaryKey].filter(Boolean).filter(v => designs[v]?.designName)
    .map(v => `${v==='front'?'Front':(meta.views.find(mv=>mv.key===v)?.label||'Back')}: ${designs[v].designName}`)
    .join(' · ');

  // Swatch dots
  const swatchHTML = colors.map(c => {
    const hex = getColorHex(c);
    const isLight = c === 'White' || c === 'Off White' || c === 'Natural';
    return `<div class="ts-swatch${c === state.color ? ' active' : ''}"
      style="background:${hex};${isLight ? 'border:1px solid #555;' : ''}"
      title="${c}"
      onclick="setCardColor('${cardId}','${c}',this)"
      data-card="${cardId}"></div>`;
  }).join('');

  // Size chips
  const sizeHTML = sizes.map(s =>
    `<span class="ts-size-chip${s === state.size ? ' selected' : ''}"
      onclick="setCardSize('${cardId}','${s}',this)">${s}</span>`
  ).join('');

  return `
    <div class="ts-card" id="tscard-${cardId}">
      <!-- PREVIEWER -->
      <div class="ts-card-previewer">
        ${hasViews ? `
          <div class="ts-card-view-toggle">
            ${meta.views.map(v => `
              <button class="ts-card-view-btn${v.key === state.view ? ' active' : ''}"
                onclick="setCardView('${cardId}','${product.type}','${v.key}',this.closest('.ts-card-view-toggle'))">
                ${v.label}
              </button>`).join('')}
          </div>` : ''}

        ${hasMockup ? `
          <img class="ts-card-mockup" id="tsmock-${cardId}"
            src="${mockupSrc}" alt="${meta.label}" loading="lazy">
          <div class="ts-card-tint" id="tstint-${cardId}" style="${tintStyle}"></div>
          ${overlaysHTML}
        ` : `
          <div class="ts-card-placeholder">
            <div class="ts-card-placeholder-icon">${meta.icon}</div>
            <div class="ts-card-placeholder-text">Mockup Coming Soon</div>
          </div>
        `}
      </div>

      <!-- BODY -->
      <div class="ts-card-body">
        <div class="ts-card-labels">
          <div>
            <div class="ts-card-name">${meta.label}</div>
            ${designSummary ? `<div class="ts-card-design-name">${designSummary}</div>` : ''}
          </div>
          <div class="ts-card-price">$${unitPrice.toFixed(2)}</div>
        </div>

        <!-- COLOR SWATCHES -->
        <div class="ts-swatches" id="tsswatches-${cardId}">${swatchHTML}</div>
        <div class="ts-color-label" id="tscolorlbl-${cardId}">${state.color}</div>

        <!-- SIZES -->
        <div class="ts-size-row" id="tssizes-${cardId}">${sizeHTML}</div>

        <!-- QTY -->
        <div class="ts-qty-row">
          <button class="ts-qty-btn" onclick="changeCardQty('${cardId}',-1)">−</button>
          <span class="ts-qty-val" id="tsqty-${cardId}">${state.qty}</span>
          <button class="ts-qty-btn" onclick="changeCardQty('${cardId}',1)">+</button>
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--up-mist);letter-spacing:1px;margin-left:4px;text-transform:uppercase;">qty</span>
        </div>

        <!-- ADD TO CART -->
        <button class="ts-add-btn" id="tsaddbtn-${cardId}"
          style="background:${teamData?.color||'var(--up-blue)'};"
          onclick="addToCart('${cardId}','${product.type}','${encodeURIComponent(designName)}','${encodeURIComponent(designUrl)}','${encodeURIComponent(secondaryDesign?.designName||'')}','${encodeURIComponent(secondaryDesign?.designUrl||'')}','${encodeURIComponent(meta.label)}',${unitPrice})">
          Add to Cart
        </button>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════
//  CARD INTERACTIONS
// ═══════════════════════════════════════════════════════
function setCardColor(cardId, colorName, dotEl) {
  cardStates[cardId].color = colorName;
  const hex = getColorHex(colorName);

  // Update tint layer
  const tint = document.getElementById('tstint-' + cardId);
  if (tint) tint.style.backgroundColor = hex;

  // Update active swatch
  document.querySelectorAll(`#tsswatches-${cardId} .ts-swatch`).forEach(d =>
    d.classList.toggle('active', d.title === colorName));

  // Update color label
  const lbl = document.getElementById('tscolorlbl-' + cardId);
  if (lbl) lbl.textContent = colorName;
}

function setCardView(cardId, prodType, viewKey, toggleEl) {
  const meta = PRODUCT_CATALOG[prodType];
  if (!meta) return;
  cardStates[cardId].view = viewKey;

  const view = meta.views.find(v => v.key === viewKey);
  if (!view) return;
  const resolvedSrc = getMockupSrc(view.src);

  // Update mockup image
  const mock = document.getElementById('tsmock-' + cardId);
  if (mock) mock.src = resolvedSrc;

  // Update tint mask
  const tint = document.getElementById('tstint-' + cardId);
  if (tint) {
    tint.style.maskImage = `url('${resolvedSrc}')`;
    tint.style.webkitMaskImage = `url('${resolvedSrc}')`;
  }

  // Show only the design overlay for this placement (each view has its own).
  meta.views.forEach(v => {
    const design = document.getElementById(`tsdesign-${cardId}-${v.key}`);
    if (design) design.style.display = (v.key === viewKey) ? '' : 'none';
  });

  // Update toggle buttons
  if (toggleEl) {
    toggleEl.querySelectorAll('.ts-card-view-btn').forEach(btn =>
      btn.classList.toggle('active', btn.textContent.trim().toLowerCase() === viewKey));
  }
}

function setCardSize(cardId, size, chipEl) {
  cardStates[cardId].size = size;
  const wrap = document.getElementById('tssizes-' + cardId);
  if (wrap) wrap.querySelectorAll('.ts-size-chip').forEach(c =>
    c.classList.toggle('selected', c.textContent === size));
}

function changeCardQty(cardId, delta) {
  const state = cardStates[cardId];
  if (!state) return;
  state.qty = Math.max(1, (state.qty || 1) + delta);
  const el = document.getElementById('tsqty-' + cardId);
  if (el) { el.textContent = state.qty; el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 200); }
}

// ═══════════════════════════════════════════════════════
//  CART
// ═══════════════════════════════════════════════════════
function addToCart(cardId, prodType, frontNameEnc, frontUrlEnc, backNameEnc, backUrlEnc, labelEnc, unitPrice) {
  const state = cardStates[cardId];
  if (!state) return;
  if (!state.size) { showToast('Please select a size'); return; }

  const frontDesignName = decodeURIComponent(frontNameEnc);
  const frontDesignUrl  = decodeURIComponent(frontUrlEnc);
  const backDesignName  = decodeURIComponent(backNameEnc);
  const backDesignUrl   = decodeURIComponent(backUrlEnc);
  const label            = decodeURIComponent(labelEnc);
  const qty              = state.qty || 1;

  cart.push({
    id:         Date.now(),
    type:       prodType,
    label,
    // Flat fields = front's design (or whichever exists) — kept as-is so the
    // EmailJS templates already consuming these don't need changes.
    designName: frontDesignName,
    designUrl:  frontDesignUrl,
    frontDesignName, frontDesignUrl,
    backDesignName, backDesignUrl,
    color:      state.color,
    size:       state.size,
    qty,
    unitPrice,
    price:      parseFloat((unitPrice * qty).toFixed(2)),
  });

  updateCartUI();
  openCart();
  showToast(`${label} added to cart!`);
}

function removeFromCart(id) {
  cart = cart.filter(i => i.id !== id);
  updateCartUI();
  renderCartItems();
}

function cartQty()   { return cart.reduce((s,i) => s + i.qty, 0); }
function cartTotal() { return cart.reduce((s,i) => s + i.unitPrice * i.qty, 0); }

function updateCartUI() {
  const qty   = cartQty();
  const sub   = cartTotal();
  const ship  = getShipping(qty);
  const grand = sub + ship;

  const countEl = document.getElementById('tsCartCount');
  if (countEl) { countEl.textContent = qty; countEl.classList.add('bump'); setTimeout(() => countEl.classList.remove('bump'), 200); }

  const lbl = document.getElementById('tsCartQtyLabel');
  if (lbl) lbl.textContent = qty ? `(${qty} item${qty!==1?'s':''})` : '';

  const subEl   = document.getElementById('tsCartSubtotal');
  const shipEl  = document.getElementById('tsCartShipping');
  const totalEl = document.getElementById('tsCartTotal');
  if (subEl)   subEl.textContent   = `$${sub.toFixed(2)}`;
  if (shipEl)  shipEl.textContent  = qty ? `$${ship.toFixed(2)}` : '—';
  if (totalEl) totalEl.textContent = `$${grand.toFixed(2)}`;

  const btn = document.getElementById('tsCheckoutBtn');
  if (btn) btn.disabled = !qty;

  renderCartItems();
}

function renderCartItems() {
  const wrap = document.getElementById('tsCartItems');
  if (!wrap) return;
  if (!cart.length) {
    wrap.innerHTML = '<div class="ts-cart-empty">Your cart is empty</div>';
    return;
  }
  wrap.innerHTML = cart.map(item => `
    <div class="ts-cart-item">
      <div class="ts-cart-item-swatch" style="background:${getColorHex(item.color)};${item.color==='White'||item.color==='Off White'?'border:1px solid #555;':''}"></div>
      <div class="ts-cart-item-info">
        <div class="ts-cart-item-name">${item.label}</div>
        <div class="ts-cart-item-meta">
          ${[item.frontDesignName, item.backDesignName].filter(Boolean).join(' / ')}${item.frontDesignName||item.backDesignName ? ' · ' : ''}${item.color} · ${item.size} · Qty ${item.qty}
        </div>
      </div>
      <div class="ts-cart-item-price">$${(item.unitPrice * item.qty).toFixed(2)}</div>
      <button class="ts-cart-item-del" onclick="removeFromCart(${item.id})" title="Remove">✕</button>
    </div>`).join('');
}

function openCart() {
  document.getElementById('tsCartDrawer').classList.add('open');
  document.getElementById('tsCartBackdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderCartItems();
}
function closeCart() {
  document.getElementById('tsCartDrawer').classList.remove('open');
  document.getElementById('tsCartBackdrop').classList.remove('open');
  document.body.style.overflow = '';
}

// ═══════════════════════════════════════════════════════
//  CHECKOUT
// ═══════════════════════════════════════════════════════
function updateCheckoutTotals() {
  const qty   = cartQty();
  const sub   = cartTotal();
  const ship  = getShipping(qty);
  const grand = sub + ship;
  const shipEl  = document.getElementById('co-ship-display');
  const totalEl = document.getElementById('co-total-display');
  if (shipEl)  shipEl.textContent  = ship === 0 ? 'FREE' : `$${ship.toFixed(2)}`;
  if (totalEl) totalEl.textContent = `$${grand.toFixed(2)}`;
  renderPayPal(grand);
}

  closeCart();
  const qty   = cartQty();
  const sub   = cartTotal();
  const ship  = getShipping(qty);

  const rows = cart.map(i => {
    const designs = [i.frontDesignName, i.backDesignName].filter(Boolean).join(' / ');
    return `
    <div class="ts-order-row">
      <span>${i.label} ${designs?'('+designs+')':''} — ${i.color}, ${i.size} × ${i.qty}</span>
      <span>$${(i.unitPrice * i.qty).toFixed(2)}</span>

  document.getElementById('tsCheckoutContent').innerHTML = `
    <div class="ts-modal-head">
      <div class="ts-modal-title">Checkout — ${teamData?.name || 'Team Store'}</div>
      <button class="ts-modal-close" onclick="closeCheckout()">✕</button>
    </div>
    <div class="ts-modal-body">

        <div class="ts-form-f"><label>Last Name *</label><input id="co-last" placeholder="Smith" required></div>

        <div class="ts-form-f full"><label>Phone</label><input id="co-phone" type="tel" placeholder="(304) 555-0100"></div>
        <div class="ts-form-f full"><label>Shipping Address *</label><input id="co-addr" placeholder="123 Main St" required></div>
        <div class="ts-form-f"><label>City *</label><input id="co-city" placeholder="Huntington" required></div>
        <div class="ts-form-f"><label>State</label><input id="co-state" placeholder="WV" maxlength="2" oninput="this.value=this.value.toUpperCase()"></div>
        <div class="ts-form-f"><label>ZIP *</label><input id="co-zip" placeholder="25701" required></div>

          <select id="co-ship-method" onchange="updateCheckoutTotals()" style="width:100%;padding:10px 12px;background:var(--up-card);color:var(--up-silver);border:1px solid var(--up-border);font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:1px;">
            <option value="pickup">Local Orders Only (Porch Pickup) — FREE</option>
            <option value="local">Huntington Area (Meet Locally) — $5.00</option>
            <option value="usps" selected>USPS Shipping — calculated below</option>
          </select>
        </div>
      </div>
      <div class="ts-section-lbl">Order Summary</div>
      ${rows}
      <div class="ts-order-row"><span>Subtotal</span><span>$${sub.toFixed(2)}</span></div>
      <div class="ts-order-row"><span>Shipping</span><span id="co-ship-display">$${ship.toFixed(2)}</span></div>
      <div class="ts-order-row total"><span>Total</span><span id="co-total-display">$${grand.toFixed(2)}</span></div>
      <div class="ts-section-lbl">Payment</div>
      <div id="co-paypal"></div>
      <p style="font-size:11px;color:var(--up-mist);text-align:center;margin-top:8px;">Secure payment via PayPal. Credit/debit cards accepted through PayPal Guest Checkout.</p>
    </div>`;

  document.getElementById('tsCheckoutModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderPayPal(grand);
}

function closeCheckout() {
  document.getElementById('tsCheckoutModal').classList.remove('open');
  document.body.style.overflow = '';
}
function renderPayPal(amount) {
  const fixed = parseFloat(amount).toFixed(2);
  document.getElementById('co-paypal').innerHTML = `
    <button onclick="payWithPayPal(${fixed})" style="
      display:block;width:100%;padding:14px 20px;
      background:#0070ba;color:#fff;border:none;cursor:pointer;
      font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;transition:background .2s;">
      💳 PAY $${fixed} WITH PAYPAL
    </button>
    <p style="margin-top:8px;font-size:11px;color:#5a7296;text-align:center;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;">
      Opens PayPal in a new tab — complete your payment there, then return here.
    </p>`;
}
function payWithPayPal(amount) {
  try {
    const existing = JSON.parse(localStorage.getItem('productionOrders') || '[]');
    existing.unshift({
      id: Date.now(), timestamp: new Date().toISOString(),
      store: teamData?.name || 'Team Store',
      customer: `${document.getElementById('co-first')?.value||''} ${document.getElementById('co-last')?.value||''}`.trim(),
      phone: document.getElementById('co-phone')?.value || '',
      email: document.getElementById('co-email')?.value || '',
      items: cart.map(i => ({
        name: i.label, size: i.size||'', color: i.color||'', qty: i.qty,
        graphicName: i.frontDesignName||'', graphicImg: i.frontDesignUrl||'',
        graphicNameBack: i.backDesignName||'', graphicImgBack: i.backDesignUrl||'',
      })),
      completed: false
    });
    localStorage.setItem('productionOrders', JSON.stringify(existing));
  } catch(e) {}
  // Save cart to KV so the IPN email includes order details
  try {
    const v = id => document.getElementById(id)?.value || '';
    const lineItems = cart.map(i => {
      const designs = [i.frontDesignName && `Front: ${i.frontDesignName}`, i.backDesignName && `Back: ${i.backDesignName}`].filter(Boolean).join(', ');
      return `${i.label}${designs?' ('+designs+')':''} — ${i.color}, ${i.size} x ${i.qty} = $${(i.unitPrice*i.qty).toFixed(2)}`;
    }).join('\n');
    fetch(`${KV_API}/api/save-cart`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: v('co-email'),
        customer_name: `${v('co-first')} ${v('co-last')}`,
        phone: v('co-phone'),
        address: `${v('co-addr')}, ${v('co-city')}, ${v('co-state')} ${v('co-zip')}`,
        notes: v('co-notes'),
        order_items: lineItems,
        shipping_method: document.getElementById('co-ship-method')?.options[document.getElementById('co-ship-method')?.selectedIndex]?.text || '',
        total: `$${(cartTotal()+getShipping(cartQty())).toFixed(2)}`,
        store_name: teamData?.name || 'Team Store',
      })
    }).catch(e => console.warn('Cart save failed:', e));
  } catch(e) {}
  window.open(`https://www.paypal.com/paypalme/theonlymrscarver/${amount}`, '_blank', 'noopener,noreferrer');
  // Must send while cart/form fields are still intact — both get wiped out below.
  sendOrderEmail({id:'PAYPAL-DIRECT'});
  cart = []; updateCartUI();
  document.getElementById('tsCheckoutContent').innerHTML = `
    <div class="ts-success">
      <div class="ts-success-icon">💳</div>
      <div class="ts-success-title">ALMOST DONE!</div>
      <div class="ts-success-msg">
        A PayPal tab just opened — complete your $${amount} payment there.<br><br>
        Your order has been logged. If the tab didn't open,
        <a href="https://www.paypal.com/paypalme/theonlymrscarver/${amount}"
           target="_blank" rel="noopener noreferrer" style="color:#4d9fff;">click here to pay</a>.<br><br>
        Questions? Call <strong>(304) 633-6401</strong>
      </div>
      <button class="ts-submit-btn" onclick="closeCheckout()" style="max-width:200px;">Done</button>
    </div>`;
  document.getElementById('tsCheckoutModal').classList.add('open');
}

function showSuccess(details) {
  document.getElementById('tsCheckoutContent').innerHTML = `
    <div class="ts-success">
      <div class="ts-success-icon">✅</div>
      <div class="ts-success-title">Order Placed!</div>
      <div class="ts-success-msg">
        Thank you, ${details.payer?.name?.given_name||''}! Your order has been received.<br>
        You'll receive a confirmation email from Erin shortly.<br><br>
        Custom items ship in 7–10 business days.
      </div>
      <button class="ts-submit-btn" onclick="closeCheckout()" style="max-width:200px;">Continue Shopping</button>
    </div>`;
  document.getElementById('tsCheckoutModal').classList.add('open');
}

async function sendOrderEmail(details) {
  if (typeof emailjs === 'undefined' || !EMAILJS_SERVICE_ID) {
    console.warn('EmailJS not configured — skipping email');
    return;
  }
  const v = id => document.getElementById(id)?.value || '';
  const designSummary = i => [i.frontDesignName && `Front: ${i.frontDesignName}`, i.backDesignName && `Back: ${i.backDesignName}`].filter(Boolean).join(', ');
  const lineItems = cart.map(i => {
    const designs = designSummary(i);
    return `${i.label}${designs?' ('+designs+')':''} — ${i.color}, ${i.size} × ${i.qty} = $${(i.unitPrice*i.qty).toFixed(2)}`;
  }).join('\n');
  const customerName    = `${v('co-first')} ${v('co-last')}`.trim();
  const customerEmail   = v('co-email');
  const customerPhone   = v('co-phone');
  const shippingAddress = `${v('co-addr')}, ${v('co-city')}, ${v('co-state')} ${v('co-zip')}`;
  const shippingMethod  = document.getElementById('co-ship-method')?.options[document.getElementById('co-ship-method')?.selectedIndex]?.text || '';
  const shippingCost    = getShipping(cartQty());
  const orderTotal      = `$${(cartTotal()+shippingCost).toFixed(2)}`;
  // EmailJS's "New Order Made" template (Erin's copy) uses its own e-commerce
  // shape: top-level {{name}}/{{order_id}}, an {{#orders}} loop needing
  // {{image_url}}/{{name}}/{{units}}/{{price}} plus customer_email/customer_phone/
  // shipping_address/shipping_method/color/design_name/size per item (the template
  // repeats customer info on every line item rather than showing it once), and
  // {{cost.shipping}}/{{cost.tax}}.
  const orders = cart.map(i => {
    const designs = designSummary(i);
    return {
      image_url:        i.designUrl || '',
      name:              `${i.label}${designs?' ('+designs+')':''} — ${i.color}, ${i.size}`,
      units:             i.qty,
      price:             i.unitPrice.toFixed(2),
      customer_email:    customerEmail,
      customer_phone:    customerPhone,
      shipping_address:  shippingAddress,
      shipping_method:   shippingMethod,
      color:             i.color || '',
      design_name:       designs || '',
      size:              i.size || '',
    };
  });
  // Field names are duplicated under both this file's original naming and the
  // customer_*/shipping_address/order_total naming used elsewhere, since both
  // checkout flows send to the same EmailJS templates and the template's actual
  // placeholder names weren't verifiable from here — unused keys are harmless.
  const sharedParams = {
    name:             customerName,
    orders,
    cost:             { shipping: shippingCost.toFixed(2), tax: '0.00', total: (cartTotal()+shippingCost).toFixed(2) },
    store_name:       teamData?.name || 'Team Store',
    customer_name:    customerName,
    email:            customerEmail,
    customer_email:   customerEmail,
    phone:            customerPhone,
    customer_phone:   customerPhone,
    address:          shippingAddress,
    shipping_address: shippingAddress,
    notes:            v('co-notes'),
    order_items:      lineItems,
    shipping_method:  shippingMethod,
    total:            orderTotal,
    order_total:      orderTotal,
    order_id:         details.id || '',
    paypal_id:        details.id || '',
  };
  if (EMAILJS_ORDER_CONFIRM_ID) {
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_ORDER_CONFIRM_ID, {
      ...sharedParams,
      to_email: customerEmail,
      reply_to: 'erin@underpressurecustomapparel.com'
    }).catch(e => console.warn('Customer confirmation email failed:', e));
  }
  if (EMAILJS_NEW_ORDER_ID) {
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_NEW_ORDER_ID, {
      ...sharedParams,
      to_email: 'erin@underpressurecustomapparel.com',
      reply_to: customerEmail
    }).catch(e => console.warn('Erin email failed:', e));
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('tsToast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
